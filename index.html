<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Analytics | Estratégia Orientada por Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f111a',
                            card: '#1b1f3b',
                            primary: '#0066ff',
                            secondary: '#00c3ff',
                            accent: '#4d94ff',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f111a; color: #f8fafc; font-family: sans-serif; }
    </style>

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1797584787882895');
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1797584787882895&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body class="min-h-screen flex flex-col items-center">

    <header class="w-full py-6 px-4 flex justify-center border-b border-white/5 bg-brand-dark/50 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <svg viewBox="0 0 100 100" class="w-9 h-9 drop-shadow-md" xmlns="http://www.w3.org/2000/svg">
                <path d="M 15 10 V 85 H 85 V 60 H 40 V 10 Z" fill="#f2efeb" />
                <path d="M 45 55 H 85 V 20 Z" fill="#597491" />
            </svg>
            <span class="font-bold text-xl tracking-tight text-brand-text">Lucas<span class="text-brand-muted font-medium">Analytics</span></span>
        </div>
    </header>

    <div id="app" class="w-full max-w-2xl px-4 py-12">
        <div id="start-screen" class="text-center space-y-8">
            <h1 class="text-4xl md:text-6xl font-bold tracking-tight">Sua clínica pode estar perdendo lucro <span class="text-brand-primary">todos os meses sem perceber.</span></h1>
            <p class="text-brand-muted text-lg md:text-xl max-w-lg mx-auto">Responda 6 perguntas estratégicas e descubra o nível de maturidade financeira da sua operação.</p>
            
            <div class="space-y-6 pt-4">
                <!-- EVENTO 1: Lead — disparado ao iniciar o quiz -->
                <button onclick="startQuiz()" class="btn-float inline-block bg-brand-primary hover:bg-blue-600 text-white px-10 py-5 rounded-xl font-bold text-lg transition-all animate-float shadow-[0_0_20px_rgba(0,102,255,0.4)]">
                    QUERO MEU DIAGNÓSTICO
                </button>
                <div class="flex justify-center gap-8 text-sm text-brand-muted uppercase tracking-widest font-medium">
                    <span class="flex items-center gap-2">⏱ 2 min</span>
                    <span class="flex items-center gap-2">🎯 6 perguntas</span>
                    <span class="flex items-center gap-2">🚀 100% gratuito</span>
                </div>
            </div>
        </div>

        <div id="quiz-container" class="hidden">
            <div class="w-full h-1.5 bg-brand-card rounded-full mb-10 overflow-hidden">
                <div id="progress-fill" class="h-full bg-brand-primary transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="bg-brand-card p-8 md:p-10 rounded-3xl border border-white/10 shadow-2xl">
                <h2 id="question-text" class="text-2xl md:text-3xl font-semibold mb-8 leading-snug"></h2>
                <div id="options-container" class="space-y-4"></div>
            </div>
        </div>

        <div id="result-screen" class="hidden bg-brand-card p-8 md:p-10 rounded-3xl border border-white/10 shadow-2xl space-y-6">
            <h2 id="result-title" class="text-3xl font-bold"></h2>
            <p id="result-desc" class="text-brand-muted"></p>
            <div id="findings" class="space-y-3 py-4"></div>
            <div class="pt-8 border-t border-white/10">
                <!-- EVENTO 3: Contact — disparado ao clicar no WhatsApp -->
                <a id="whatsapp-link" href="#" target="_blank" onclick="fbq('track', 'Contact')" class="block text-center bg-gradient-to-r from-brand-primary to-brand-secondary hover:brightness-110 text-white py-4 rounded-xl font-bold text-lg transition-all shadow-lg">
                    QUERO UMA ANÁLISE ESTRATÉGICA
                </a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "Você sabe exatamente quais procedimentos realmente dão lucro?", options: [{t:"Sim, acompanho meus números", s:3}, {t:"Tenho uma noção", s:1}, {t:"Não tenho clareza", s:0}] },
            { q: "De cada 10 clientes novos, quantos voltam em 90 dias?", options: [{t:"7 ou mais", s:3}, {t:"4 a 6", s:1}, {t:"Menos de 4", s:0}, {t:"Nunca acompanhei", s:0}] },
            { q: "Você consegue identificar quais canais trazem os pacientes mais lucrativos?", options: [{t:"Sim, acompanho isso", s:3}, {t:"Parcialmente", s:1}, {t:"Não tenho esses dados", s:0}] },
            { q: "Hoje, como sua clínica define preços?", options: [{t:"Baseado em custos e margem", s:3}, {t:"Baseado na concorrência", s:1}, {t:"Mais por percepção/intuição", s:0}] },
            { q: "Sua clínica acompanha CAC (custo por paciente adquirido)?", options: [{t:"Sim, com precisão", s:3}, {t:"Já ouvi falar", s:1}, {t:"Não acompanho", s:0}] },
            { q: "Se seu faturamento caísse 20% amanhã, você saberia exatamente onde agir primeiro?", options: [{t:"Plano claro", s:3}, {t:"Talvez", s:1}, {t:"Não", s:0}] }
        ];

        let currentQ = 0, score = 0;
        let userAnswers = [];

        function startQuiz() {
            // EVENTO 1: Lead — usuário iniciou o quiz
            fbq('track', 'Lead');

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQ];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-fill').style.width = `${(currentQ/questions.length)*100}%`;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-5 rounded-xl bg-brand-dark hover:bg-brand-primary/20 border border-white/5 transition-all text-lg';
                btn.innerText = opt.t;
                btn.onclick = () => { 
                    score += opt.s; 
                    userAnswers.push(`${q.q}: ${opt.t}`);
                    currentQ++; 
                    if(currentQ < questions.length) renderQuestion(); else showResult(); 
                };
                container.appendChild(btn);
            });
        }

        function showResult() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // EVENTO 2: CompleteRegistration — usuário concluiu o quiz
            fbq('track', 'CompleteRegistration');

            const percent = (score / 18) * 100;
            let res = percent <= 33
                ? {t:"Gestão no Escuro", d:"Hoje existem sinais claros de perda de margem, falta de previsibilidade e decisões sendo tomadas sem dados confiáveis.", f:["Baixa previsibilidade financeira", "Lucro abaixo do potencial real"]}
                : (percent <= 66
                    ? {t:"Em Desenvolvimento", d:"Você já possui alguns indicadores importantes, mas ainda existem oportunidades claras para aumentar margem, previsibilidade e eficiência operacional.", f:["Otimização necessária", "Retenção abaixo do potencial"]}
                    : {t:"Gestão Avançada", d:"Sua clínica demonstra maturidade de gestão, mas clínicas com esse perfil normalmente conseguem crescer ainda mais quando refinam aquisição, margem e retenção com inteligência de dados.", f:["Operação robusta", "Alta previsibilidade"]});
            
            document.getElementById('result-title').innerText = res.t;
            document.getElementById('result-desc').innerText = res.d;
            document.getElementById('findings').innerHTML = res.f.map(f => `<div class='text-brand-accent'>✓ ${f}</div>`).join('');

            const answersText = userAnswers.join('\n');
            const message = `Olá, Lucas! Fiz o diagnóstico no site. Minhas respostas:\n\n${answersText}`;
            const whatsappLink = `https://wa.me/5531999876954?text=${encodeURIComponent(message)}`;
            document.getElementById('whatsapp-link').href = whatsappLink;
        }
    </script>
</body>
</html>
